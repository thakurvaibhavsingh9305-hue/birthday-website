<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday My Love</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #fff0f5;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #e91e63;
            font-size: 2em;
        }
        h2 {
            color: #c2185b;
        }
        p {
            font-size: 1.1em;
            line-height: 1.6;
        }
        .wish-box {
            background: #ffe4e1;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .photo-placeholder {
            width: 100%;
            height: 250px;
            background-color: #eee;
            border: 2px dashed #ccc;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>HAPPY BIRTHDAY, MY LOVE MY WIFEY</h1>
            <p>Today we celebrate the most amazing person in my world 🎂</p>
        </header>

        <div class="wish-box">
            <h2>MERA BACCHA</h2>
            <p>CLOSE YOUR EYES AND MAKE A WISH!</p>
        </div>

        <div class="wish-box">
            <h2>HAPPY BIRTHDAY BUTKU</h2>
            <p>YOU ARE MY LUCKY CHARM ✨</p>
        </div>

        <!-- Add your image URL inside the src attribute below -->
        <div class="photo-placeholder">
            <p>Insert Your Image Here</p>
        </div>
    </div>

</body>
</html>
